name: LockDemo
options:
  bundleIdPrefix: com.lock
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: "$(inherited) -ObjC"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  LockDemo:
    type: application
    platform: iOS
    sources:
      - path: LockDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lock.set
        PRODUCT_NAME: LockDemo
        INFOPLIST_FILE: LockDemo/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: LockDemo/Support/LockDemo-Bridging-Header.h
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V2TAJKB5WT
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      gatherCoverageData: false
